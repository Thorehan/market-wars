<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Market Wars Prototip</title>
<style>
:root{--bg:#0f1117;--card:#1d2130;--line:#2e3448;--txt:#f1f3f8;--mute:#9aa3b8;--blue:#3b82f6;--red:#ef4444;--acc:#facc15}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,18,.55);padding:1em}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:1em;padding:1.2em 1.1em;width:100%;max-width:22em;box-shadow:0 1em 3em rgba(0,0,0,.5);max-height:100%;overflow:auto;touch-action:pan-y}
h1{margin:0;font-size:2em;letter-spacing:.02em;line-height:1.1}
h1 .b{color:var(--blue)} h1 .r{color:var(--red)}
h2{margin:0 0 .6em;font-size:1.3em}
.sub{margin:.3em 0 1em;color:var(--mute);font-size:.8em}
button{font:inherit;color:var(--txt);background:#2b3145;border:1px solid #3a4260;border-radius:.6em;padding:.7em .9em;width:100%;margin:.3em 0;cursor:pointer;font-weight:600}
button.primary{background:var(--blue);border-color:#5b9bff}
button.ghost{background:transparent}
button:active{transform:translateY(1px)}
.help{color:var(--mute);font-size:.7em;line-height:1.5;margin-top:.8em}
.help b{color:var(--txt)}
.row{display:flex;gap:.5em}
.prm{margin:.55em 0}
.prm label{display:flex;justify-content:space-between;gap:.5em;font-size:.75em;color:var(--mute)}
.prm label b{color:var(--txt)}
.prm input[type=range]{width:100%;accent-color:var(--blue)}
.tog{display:flex;align-items:center;gap:.5em;font-size:.78em;margin:.6em 0}
.tog input{width:1.2em;height:1.2em;accent-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:.78em;margin:.4em 0 .8em}
td,th{padding:.35em .3em;border-bottom:1px solid var(--line);text-align:center}
td:first-child,th:first-child{text-align:left;color:var(--mute)}
th.c0{color:var(--blue)} th.c1{color:var(--red)}
#pauseBtn{position:absolute;left:.5em;bottom:.5em;width:2.3em;height:2.3em;padding:0;border-radius:50%;margin:0;opacity:.85;font-size:1em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" class="hidden" aria-label="Duraklat">II</button>

  <div id="menu" class="ov">
    <div class="card">
      <h1><span class="b">Market</span> <span class="r">Wars</span></h1>
      <p class="sub">Prototip v0.2.1: sabotaj kutusu (5 çeşit) + kısa döngü</p>
      <button class="primary" data-mode="bot">Bot'a karşı oyna</button>
      <button data-mode="2p">2 kişi, aynı cihaz</button>
      <button data-mode="watch">Bot vs Bot izle</button>
      <button class="ghost" id="openSettings">Ayarlar</button>
      <div class="help" id="helpText"></div>
    </div>
  </div>

  <div id="settings" class="ov hidden">
    <div class="card">
      <h2>Ayarlar</h2>
      <div id="params"></div>
      <div class="row">
        <button class="ghost" id="resetParams">Varsayılan</button>
        <button class="primary" id="closeSettings">Kaydet</button>
      </div>
      <div class="help">Değişiklikler bir sonraki maçta geçerli olur ve bu tarayıcıda hatırlanır.</div>
    </div>
  </div>

  <div id="pause" class="ov hidden">
    <div class="card">
      <h2>Duraklatıldı</h2>
      <button class="primary" id="resume">Devam</button>
      <button id="restart">Yeniden başlat</button>
      <button id="pauseSettings">Ayarlar</button>
      <button class="ghost" id="pauseMenu">Ana menü</button>
    </div>
  </div>

  <div id="end" class="ov hidden">
    <div class="card">
      <h2 id="endTitle"></h2>
      <div id="endStats"></div>
      <button class="primary" id="again">Tekrar oyna</button>
      <button class="ghost" id="endMenu">Ana menü</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';

/* ================= SABİTLER ================= */
const W=540,H=960,PR=14;
const FLOOR={x0:30,x1:510,y0:150,y1:935};
const COL=['#3b82f6','#ef4444'], COLD=['#1d4ed8','#b91c1c'];
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const ZERO={x:0,y:0};

/* ================= AYARLAR ================= */
// [anahtar, etiket, min, max, adım, varsayılan]
const PARAMS=[
  ['matchTime','Maç süresi (sn)',30,300,10,180],
  ['meatInterval','Dolapta et üretim aralığı (sn)',0.25,4,0.25,1.25],
  ['stealTime','Rakipten çalma süresi (sn)',0.5,8,0.25,3],
  ['stunTime','Yakalanınca sersemleme (sn)',1,10,0.5,3],
  ['catchRadius','Yakalama mesafesi (px)',20,80,2,38],
  ['speed','Hareket hızı',120,400,10,230],
  ['carryCap','Taşıma kapasitesi (et)',5,60,1,10],
  ['cookTime','Pişirme süresi (sn)',0.5,8,0.5,3],
  ['grillSlots','Izgara kapasitesi (aynı anda)',1,10,1,4],
  ['customerInterval','Müşteri geliş aralığı (sn)',0.5,6,0.1,2],
  ['maxOrder','Maks. sipariş (et)',1,6,1,2],
  ['price','Et başı fiyat ($)',1,50,1,10],
  ['patience','Müşteri sabrı (sn)',2,20,1,6],
  ['boxEvery','Sabotaj kutusu aralığı (sn)',5,40,1,15],
  ['ratTime','Fare: kalma süresi (sn)',2,15,1,8],
  ['ratEat','Fare: kemirme aralığı (sn)',0.25,3,0.25,0.5],
  ['magnetN','Mıknatıs: çekilen müşteri',1,12,1,8],
  ['beltTime','Bant: ızgaradan tezgâha (sn)',0.25,4,0.25,1.5],
  ['counterCap','Tezgâh kapasitesi (et)',2,60,1,40],
  ['buffTime','Hız / ×2 fiyat süresi (sn)',3,30,1,10],
  ['attackEvery','Çöp torbası için gereken satış (et)',2,20,1,8],
  ['trashDrop','Çöpü rakibe bırakma süresi (sn)',0,4,0.25,1],
  ['trashClean','Çöp temizleme süresi (sn)',0.25,4,0.25,2],
  ['botAggro','Bot saldırganlığı (0-1)',0,1,0.05,0.5],
  ['botSpeed','Bot hız çarpanı',0.5,1.3,0.05,0.9],
  ['botReact','Bot savunma tepki süresi (sn)',0,2,0.1,0.6],
];
const TOGGLES=[
  ['rushHour','Son 30 sn yoğun saat (müşteri ×2)',true],
  ['moneySteal','Kasadaki para da çalınabilir',false],
  ['autoConveyor','Kısa döngü: pişen et banda kayar',true],
  ['boxOn','Ortaya düşen sabotaj kutusu',true],
  ['boxTrashCounter','Kutudaki çöp tezgâha düşer (kapalıysa ızgaraya)',true],
  ['ratMoney','Fare kasadaki parayı kemirir (kapalıysa tezgâhtaki eti)',true],
  ['stealOn','Eski: rakibin istasyonunda durup çalma',false],
  ['trashAttack','Eski: çöp torbası (satışla kazanılır, taşınır)',false],
  ['bagCatchRoad','Eski: çöp taşıyan yolda da yakalanır',true],
  ['tugWar','Halat göstergesi (kimin önde olduğu)',true],
];
const DEF={}; PARAMS.forEach(p=>DEF[p[0]]=p[5]); TOGGLES.forEach(t=>DEF[t[0]]=t[2]);
let P=Object.assign({},DEF);
const STORE='mw_params_v7'; // v7 (v0.2.1): tezgâh kapasitesi 40, hız ve ×2 fiyat kutuları
const FLOW=0.06; // kendi istasyonundan alma/bırakma: et başına sn
try{const s=JSON.parse(localStorage.getItem(STORE)||'null'); if(s) for(const k in DEF) if(k in s && typeof s[k]===typeof DEF[k]) P[k]=s[k];}catch(e){}
function saveP(){try{localStorage.setItem(STORE,JSON.stringify(P));}catch(e){}}

/* ================= YARDIMCILAR ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const $=id=>document.getElementById(id);

/* ================= CANVAS ================= */
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
let scale=1,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  scale=Math.min(innerWidth/W,innerHeight/H);
  stage.style.width=W*scale+'px'; stage.style.height=H*scale+'px';
  stage.style.fontSize=(18*scale)+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
}
addEventListener('resize',resize); resize();

/* ================= SES ================= */
let AC=null;
function beep(f=600,d=0.08,type='square',vol=0.04){
  if(!G||G.demo||G.sim)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=vol;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d+0.02);
  }catch(e){}
}

/* ================= DÜNYA ================= */
// Restoran: sol yarı = Mavi (0), sağ yarı = Kırmızı (1). Ayna simetrik.
function buildSide(s){
  const mx=x=>s?W-x:x, mr=(x,w)=>s?W-x-w:x;
  return {
    fridge:{box:{x:mr(40,90),y:150,w:90,h:55,H:60},count:0,acc:0},
    grill:{box:{x:mr(55,80),y:385,w:80,h:75,H:26},input:0,slots:[],output:0},
    counter:{box:{x:mr(172,53),y:565,w:53,h:95,H:36},stock:0,customer:null},
    money:{amount:0},
    trash:{fridge:false,grill:false,counter:false},
    bags:0, // satışla kazanılan, alınmayı bekleyen çöp torbaları
    rat:null, magnet:0, goldT:0, belt:[], // kutu etkileri ve ızgara→tezgâh bandı
    zones:{
      fridge:{x:mx(85),y:245,r:40},
      grillIn:{x:mx(95),y:345,r:34},
      grillOut:{x:mx(95),y:500,r:34},
      counter:{x:mx(142),y:612,r:34},
      money:{x:mx(198),y:712,r:32},
      bag:{x:mx(90),y:810,r:32},
    },
    custSpot:{x:mx(252),y:612},
  };
}
function mkPlayer(s){
  return {side:s,x:s?430:110,y:560,carry:[],stun:0,act:null,score:0,depT:0,face:{x:0,y:1},walk:0,moving:false,done:false,kb:null,stealLock:0,atk:0,bag:false,speedT:0,
    st:{sold:0,stole:0,caught:0,gotCaught:0,trashSent:0,trashGot:0,boxes:0,ratLost:0}};
}
function mkBot(side){return {side,goal:null,idle:false,path:[],pathT:0,thinkT:0,alertT:0,stealCd:3};}

let G=null;
function newGame(mode,opts={}){
  const sides=[buildSide(0),buildSide(1)];
  const boxes=[]; for(const S of sides) boxes.push(S.fridge.box,S.grill.box,S.counter.box);
  G={mode,demo:!!opts.demo,sim:!!opts.sim,time:P.matchTime,sides,boxes,players:[mkPlayer(0),mkPlayer(1)],
     customers:[],spawnT:0.5,toasts:[],floats:[],bots:[],over:false,paused:false,rush:false,t:0,box:null,boxT:P.boxEvery};
  G.nav=buildNav();
  if(mode==='bot')G.bots=[mkBot(1)];
  else if(mode==='watch')G.bots=[mkBot(0),mkBot(1)];
  sticks.clear();
  if(!G.demo&&!G.sim&&mode!=='watch') toast('Dolap → Izgara → Servis → Kasa','#fff');
}
const isHuman=s=>G.mode==='2p'||(G.mode==='bot'&&s===0);
function names(){
  if(G.mode==='bot')return ['SEN','BOT'];
  if(G.mode==='2p')return ['MAVİ','KIRMIZI'];
  return ['MAVİ BOT','KIRMIZI BOT'];
}
function toast(text,color){G.toasts.push({text,color,t:0,life:1.8}); if(G.toasts.length>3)G.toasts.shift();}
function addFloat(x,y,text,color){G.floats.push({x,y,text,color,t:0,life:1.2});}

/* ================= ÇARPIŞMA ================= */
function collide(p){
  for(const b of G.boxes){
    const cx=clamp(p.x,b.x,b.x+b.w), cy=clamp(p.y,b.y,b.y+b.h);
    const dx=p.x-cx, dy=p.y-cy, d=Math.hypot(dx,dy);
    if(d<PR){
      if(d>0.0001){p.x=cx+dx/d*PR;p.y=cy+dy/d*PR;}
      else{
        const l=p.x-b.x,r=b.x+b.w-p.x,t=p.y-b.y,bt=b.y+b.h-p.y,m=Math.min(l,r,t,bt);
        if(m===l)p.x=b.x-PR;else if(m===r)p.x=b.x+b.w+PR;else if(m===t)p.y=b.y-PR;else p.y=b.y+b.h+PR;
      }
    }
  }
  p.x=clamp(p.x,FLOOR.x0+PR,FLOOR.x1-PR); p.y=clamp(p.y,FLOOR.y0+PR,FLOOR.y1-PR);
}

/* ================= BOT YOL BULMA ================= */
const inflate=(b,i)=>({x0:b.x-i,y0:b.y-i,x1:b.x+b.w+i,y1:b.y+b.h+i});
const inRect=(p,r)=>p.x>r.x0&&p.x<r.x1&&p.y>r.y0&&p.y<r.y1;
function segRect(a,b,r){
  let t0=0,t1=1; const dx=b.x-a.x,dy=b.y-a.y;
  const p=[-dx,dx,-dy,dy], q=[a.x-r.x0,r.x1-a.x,a.y-r.y0,r.y1-a.y];
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0)return false; }
    else{ const t=q[i]/p[i];
      if(p[i]<0){ if(t>t1)return false; if(t>t0)t0=t; }
      else{ if(t<t0)return false; if(t<t1)t1=t; } }
  }
  return true;
}
const segHits=(a,b,R)=>R.some(r=>segRect(a,b,r));
function buildNav(){
  const rects=G.boxes.map(b=>inflate(b,12)), nodes=[];
  for(const b of G.boxes){
    const I=22;
    for(const [x,y] of [[b.x-I,b.y-I],[b.x+b.w+I,b.y-I],[b.x-I,b.y+b.h+I],[b.x+b.w+I,b.y+b.h+I]]){
      if(x<FLOOR.x0+PR||x>FLOOR.x1-PR||y<FLOOR.y0+PR||y>FLOOR.y1-PR)continue;
      if(rects.some(r=>inRect({x,y},r)))continue;
      nodes.push({x,y});
    }
  }
  const adj=nodes.map(()=>[]);
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)
    if(!segHits(nodes[i],nodes[j],rects)){const d=dist(nodes[i],nodes[j]);adj[i].push([j,d]);adj[j].push([i,d]);}
  return {nodes,adj,rects};
}
function findPath(S,T){
  const N=G.nav, R=N.rects.filter(r=>!inRect(S,r)&&!inRect(T,r));
  if(!segHits(S,T,R))return [{x:T.x,y:T.y}];
  const n=N.nodes.length, d=new Array(n).fill(Infinity), prev=new Array(n).fill(-1), done=new Array(n).fill(false);
  for(let i=0;i<n;i++) if(!segHits(S,N.nodes[i],R)) d[i]=dist(S,N.nodes[i]);
  let best=Infinity,bestI=-1;
  for(;;){
    let u=-1,ud=Infinity;
    for(let i=0;i<n;i++) if(!done[i]&&d[i]<ud){ud=d[i];u=i;}
    if(u<0||ud>=best)break;
    done[u]=true;
    if(!segHits(N.nodes[u],T,R)){const tot=ud+dist(N.nodes[u],T); if(tot<best){best=tot;bestI=u;}}
    for(const [v,w] of N.adj[u]) if(!done[v]&&ud+w<d[v]){d[v]=ud+w;prev[v]=u;}
  }
  if(bestI<0)return [{x:T.x,y:T.y}];
  const path=[{x:T.x,y:T.y}]; let c=bestI;
  while(c>=0){path.unshift(N.nodes[c]);c=prev[c];}
  return path;
}

/* ================= ETKİLEŞİM ================= */
// Kapalı kurallara ait bölgeler yok sayılır (bant açıksa ızgara çıkışı, çöp kapalıysa çöp alanı)
const zoneOn=k=>k==='grillOut'?!P.autoConveyor:k==='bag'?P.trashAttack:true;
function zoneAt(p){
  let best=null,bd=1e9;
  for(let s=0;s<2;s++){const Z=G.sides[s].zones;
    for(const k in Z){if(!zoneOn(k))continue;const z=Z[k],d=Math.hypot(p.x-z.x,p.y-z.y); if(d<z.r&&d<bd){bd=d;best={side:s,key:k};}}}
  return best;
}
function availAt(side,key){
  const S=G.sides[side];
  switch(key){case'fridge':return S.fridge.count;case'grillOut':return S.grill.output;case'counter':return S.counter.stock;case'money':return S.money.amount;}
  return 0;
}
function takeFrom(side,key,n){
  const S=G.sides[side];
  switch(key){case'fridge':S.fridge.count-=n;break;case'grillOut':S.grill.output-=n;break;case'counter':S.counter.stock-=n;break;case'money':S.money.amount-=n;break;}
}
// Bölgedeki her şeyi (kapasite kadar) p'nin kucağına al. Para direkt skora gider.
function grab(p,side,key){
  const av=availAt(side,key);
  if(key==='money'){ if(av>0){takeFrom(side,key,av);p.score+=av;} return av; }
  const n=Math.min(av,P.carryCap-p.carry.length); if(n<=0)return 0;
  takeFrom(side,key,n); const t=key==='fridge'?'r':'c';
  for(let i=0;i<n;i++)p.carry.push(t);
  return n;
}
function timed(p,zn,dur,steal,dt,fn){
  if(!p.act){p.act={side:zn.side,key:zn.key,t:0,dur,steal}; if(steal)onStealStart(p,zn);}
  p.act.dur=dur; p.act.t+=dt;
  if(p.act.t>=dur){p.act=null;fn();p.done=true;}
}
function onStealStart(p,zn){
  const v=1-p.side;
  if(isHuman(v)&&!G.demo){toast(p.act&&p.act.drop?'Çöp bırakılıyor!':zn.key==='money'?'Paran çalınıyor!':'Etlerin çalınıyor!','#f43f5e');beep(880,0.12);setTimeout(()=>beep(880,0.12),150);}
}
// Kendi istasyonunda: etler tek tek akar (beklemek yok).
function flow(p,dt,n,fn){
  p.depT+=dt; let k=0;
  while(p.depT>=FLOW&&k<n){p.depT-=FLOW;fn();k++;}
  if(k>=n){p.depT=0;p.done=true;}
}
function interact(p,dt){
  if(p.stun>0){p.act=null;return;}
  const zn=zoneAt(p);
  if(!zn){p.act=null;p.depT=0;return;}
  if(p.act&&(p.act.key!==zn.key||p.act.side!==zn.side))p.act=null;
  const own=zn.side===p.side, S=G.sides[zn.side], space=P.carryCap-p.carry.length;
  const st=ST[zn.key];
  // Çöp torbası alanı: kendi torbanı al (aynı anda 1 torba taşınır)
  if(zn.key==='bag'){
    if(own&&S.bags>0&&!p.bag){S.bags--;p.bag=true;p.done=true;if(isHuman(p.side))beep(420,0.08,'triangle');}
    p.act=null;return;
  }
  // Çöplü istasyon: sahibi temizleyene kadar kimse kullanamaz (rakip de çalamaz)
  if(st&&S.trash[st]){
    p.depT=0;
    if(!own){p.act=null;return;}
    timed(p,zn,P.trashClean,false,dt,()=>{S.trash[st]=false;addFloat(p.x,p.y-80,'Temizlendi','#a3e635');if(isHuman(p.side))beep(700,0.06,'triangle');});
    return;
  }
  if(own){
    if(zn.key==='grillIn'||zn.key==='counter'){
      const t=zn.key==='grillIn'?'r':'c';
      const n=p.carry.filter(c=>c===t).length;
      const room=t==='c'?Math.min(n,P.counterCap-S.counter.stock):n;
      if(room<=0){p.depT=0;return;}
      flow(p,dt,room,()=>{const i=p.carry.lastIndexOf(t);p.carry.splice(i,1);if(t==='r')S.grill.input++;else S.counter.stock++;});
      return;
    }
    if(zn.key==='money'){
      const a=grab(p,zn.side,'money');
      if(a>0){addFloat(p.x,p.y-80,'+$'+a,'#22c55e');p.done=true;if(isHuman(p.side))beep(1200,0.06,'triangle');}
      return;
    }
    // dolap / ızgara çıkışı: üstünden geçince etler akar
    const n=Math.min(availAt(zn.side,zn.key),space);
    if(n<=0){p.depT=0;return;}
    flow(p,dt,n,()=>{takeFrom(zn.side,zn.key,1);p.carry.push(zn.key==='fridge'?'r':'c');});
  }else{
    if(zn.key==='grillIn'&&!p.bag)return;
    // Çöp taşıyorsan rakibin istasyonuna bırakırsın (çalmak yerine)
    if(p.bag&&st){
      if(p.stealLock>0){p.act=null;return;}
      if(!p.act){p.act={side:zn.side,key:zn.key,t:0,dur:P.trashDrop,steal:true,drop:true};onStealStart(p,zn);}
      p.act.t+=dt;
      if(p.act.t>=P.trashDrop){
        p.act=null;p.bag=false;p.done=true;S.trash[st]=true;
        p.st.trashSent++;G.players[zn.side].st.trashGot++;
        addFloat(p.x,p.y-80,'Çöp bırakıldı!','#a3e635');
        if(isHuman(zn.side))beep(150,0.2,'sawtooth');
      }
      return;
    }
    if(!P.stealOn){p.act=null;return;}
    if(zn.key==='grillIn')return;
    if(zn.key==='money'&&!P.moneySteal)return;
    if(p.stealLock>0){p.act=null;return;}
    const av=availAt(zn.side,zn.key);
    if(av<=0||(zn.key!=='money'&&space<=0)){p.act=null;return;}
    timed(p,zn,P.stealTime,true,dt,()=>{
      const n=grab(p,zn.side,zn.key);
      if(zn.key==='money'){addFloat(p.x,p.y-80,'+$'+n+' çalındı','#facc15');}
      else{p.st.stole+=n;addFloat(p.x,p.y-80,'+'+n+' çalındı!','#facc15');}
      if(isHuman(p.side)||isHuman(1-p.side))beep(300,0.15,'sawtooth');
    });
  }
}
// Yakalanan hırsızı bölgenin dışına, engelsiz ve başka bir bölgeye denk gelmeyen bir noktaya savurur.
const STEAL_LOCK_AFTER=1.5, KB_TIME=0.25;
function knockback(p,z){
  const R=G.nav.rects, D=z.r+PR+30;
  const base=(p.x===z.x&&p.y===z.y)?(p.side?0:Math.PI):Math.atan2(p.y-z.y,p.x-z.x);
  const ok=(t,strict)=>{
    if(t.x<FLOOR.x0+PR||t.x>FLOOR.x1-PR||t.y<FLOOR.y0+PR||t.y>FLOOR.y1-PR)return false;
    if(R.some(r=>inRect(t,r)))return false;
    if(strict&&(zoneAt(t)||segHits(p,t,R)))return false;
    return true;
  };
  for(const strict of [true,false])
    for(let i=0;i<=6;i++)for(const sg of (i?[1,-1]:[1])){
      const a=base+sg*i*Math.PI/6, t={x:z.x+Math.cos(a)*D,y:z.y+Math.sin(a)*D};
      if(ok(t,strict)){p.kb={vx:(t.x-p.x)/KB_TIME,vy:(t.y-p.y)/KB_TIME,t:KB_TIME};return;}
    }
}
const inRivalHalf=p=>p.side===0?p.x>W/2:p.x<W/2;
function checkCatches(){
  for(const p of G.players){
    if(p.stun>0)continue;
    const o=G.players[1-p.side];
    // Çöp taşıyan, rakibin yarısında yakalanırsa torbayı kaybeder
    if(p.bag&&((P.bagCatchRoad&&inRivalHalf(p))||(p.act&&p.act.drop))&&o.stun<=0&&dist(p,o)<P.catchRadius){
      p.bag=false;knockback(p,{x:o.x,y:o.y,r:10});
      p.stun=P.stunTime;p.stealLock=P.stunTime+STEAL_LOCK_AFTER;p.act=null;p.st.gotCaught++;o.st.caught++;
      toast('YAKALANDI!','#facc15');addFloat(o.x,o.y-80,'Çöp engellendi','#22c55e');beep(200,0.25,'square',0.05);
      continue;
    }
    if(!p.act||!p.act.steal)continue;
    if(o.stun>0||dist(p,o)>=P.catchRadius)continue;
    const key=p.act.key, n=grab(o,o.side,key);
    knockback(p,G.sides[o.side].zones[key]);
    p.stun=P.stunTime; p.stealLock=P.stunTime+STEAL_LOCK_AFTER; p.act=null; p.st.gotCaught++; o.st.caught++;
    toast('YAKALANDI!','#facc15');
    addFloat(o.x,o.y-80,key==='money'?'+$'+n:'+'+n+' geri alındı','#22c55e');
    beep(200,0.25,'square',0.05);
  }
}

const ST={fridge:'fridge',grillIn:'grill',grillOut:'grill',counter:'counter'};
const MAX_BAGS=3;
function trashSpot(S,st){const b=S[st].box;return {x:b.x+b.w/2,y:b.y-b.H+b.h/2};}

// Her P.boxEvery sn'de ortaya bir kutu düşer; içindeki etki üstünde görünür. İlk dokunan alır, etki kendiliğinden uygulanır.
const BOX_FALL=1, BOX_TYPES=['rat','trash','magnet','speed','gold'];
const BOX_INFO={rat:{icon:'🐀',name:'FARE'},trash:{icon:'🗑️',name:'ÇÖP'},magnet:{icon:'🧲',name:'MIKNATIS'},speed:{icon:'👟',name:'HIZ'},gold:{icon:'💰',name:'×2 FİYAT'}};
const BELT_GAP=0.18, BELT_MAX=5, SPEED_BOOST=1.5;
// Bir sonraki kutunun yeri ve içeriği önceden belli olur; düşmeden 3 sn önce yerde gösterilir.
function makeBox(){
  const type=BOX_TYPES[Math.floor(Math.random()*BOX_TYPES.length)];
  return {x:W/2+(Math.random()*40-20),y:240+Math.random()*230,type,t:0};
}
function applyBox(p,type){
  const v=1-p.side,S=G.sides[p.side],E=G.sides[v];
  p.st.boxes++;
  const msgSelf={rat:'Fare rakibe gitti!',trash:P.boxTrashCounter?'Rakibin tezgâhına çöp!':'Rakibin ızgarasına çöp!',magnet:'Müşteriler sana gelecek!',speed:'Hız ayakkabısı!',gold:'Satışların ×2!'}[type];
  const msgRival={rat:P.ratMoney?'Kasanda fare var!':'Tezgâhında fare var!',trash:P.boxTrashCounter?'Tezgâhına çöp atıldı!':'Izgarana çöp atıldı!',magnet:'Rakip müşterileri çekiyor!',speed:null,gold:null}[type];
  if(type==='rat')E.rat={t:P.ratTime,eatT:0};
  else if(type==='trash'){const st=P.boxTrashCounter?'counter':'grill';if(!E.trash[st])E.trash[st]=true;else E.trash[st==='counter'?'grill':'counter']=true;G.players[v].st.trashGot++;p.st.trashSent++;}
  else if(type==='magnet')S.magnet+=P.magnetN;
  else if(type==='speed')p.speedT=P.buffTime;
  else if(type==='gold')S.goldT=P.buffTime;
  addFloat(p.x,p.y-80,BOX_INFO[type].icon+' '+BOX_INFO[type].name,'#facc15');
  if(isHuman(p.side)&&!G.demo){toast(msgSelf,'#facc15');beep(990,0.12,'triangle');}
  if(msgRival&&isHuman(v)&&!G.demo){toast(msgRival,'#f43f5e');beep(220,0.2,'sawtooth');}
}
function updateBox(dt){
  if(!P.boxOn)return;
  if(!G.box){
    if(!G.nextBox)G.nextBox=makeBox();
    G.boxT-=dt;
    if(G.boxT<=0){G.box=G.nextBox;G.nextBox=null;G.boxT=P.boxEvery;}
    return;
  }
  const b=G.box;b.t+=dt;if(b.t<BOX_FALL)return;
  // aynı karede ikisi de değerse yakın olan alır
  let best=null,bd=28;
  for(const p of G.players)if(p.stun<=0){const d=dist(p,b);if(d<bd){bd=d;best=p;}}
  if(best){G.box=null;applyBox(best,b.type);}
}
const ratZone=()=>P.ratMoney?'money':'counter';
function updateRats(dt){
  G.sides.forEach((S,s)=>{
    const r=S.rat;if(!r)return;
    const owner=G.players[s],z=S.zones[ratZone()];
    if(owner.stun<=0&&dist(owner,z)<z.r){S.rat=null;addFloat(z.x,z.y-60,'Fare kaçtı!','#22c55e');if(isHuman(s))beep(700,0.08,'triangle');return;}
    r.t-=dt;r.eatT+=dt;
    if(r.eatT>=P.ratEat){r.eatT-=P.ratEat;
      if(P.ratMoney){const a=Math.min(S.money.amount,P.price);if(a>0){S.money.amount-=a;owner.st.ratLost+=a;}}
      else if(S.counter.stock>0){S.counter.stock--;owner.st.ratLost++;}}
    if(r.t<=0)S.rat=null;
  });
}
function earnBag(side){
  const S=G.sides[side];
  if(S.bags>=MAX_BAGS)return;
  S.bags++;
  if(isHuman(side)&&!G.demo){toast('Çöp torbası hazır!','#a3e635');beep(420,0.1,'triangle');}

const CUST_COLORS=['#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b','#84cc16','#06b6d4'];
function moveTo(c,tx,ty,sp,dt){
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
  if(d<1){c.x=tx;c.y=ty;c.moving=false;return true;}
  const s=Math.min(d,sp*dt); c.x+=dx/d*s; c.y+=dy/d*s; c.walk+=dt; c.moving=true; c.face={x:dx/d,y:dy/d};
  return d-s<1;
}
function custLeave(c){
  const S=G.sides[c.side]; S.counter.customer=null;
  if(c.got>0){
    const amt=c.got*P.price*(S.goldT>0?2:1); S.money.amount+=amt; G.players[c.side].st.sold+=c.got;
    addFloat(S.zones.money.x,S.zones.money.y-30,'+$'+amt,'#22c55e');
    if(P.trashAttack){
      const p=G.players[c.side];p.atk+=c.got;
      while(p.atk>=P.attackEvery){p.atk-=P.attackEvery;earnBag(c.side);}
    }
  }else addFloat(c.x,c.y-60,'😠','#fff');
  c.state='leave'; c.exitX=c.side===0?246:294;
}
function updateCustomers(dt){
  G.spawnT-=dt;
  let queue=G.customers.filter(c=>c.state==='queue');
  if(G.spawnT<=0){
    G.spawnT=P.customerInterval*(G.rush?0.5:1)*(0.75+Math.random()*0.5);
    if(queue.length<7){
      const c={x:270,y:985,state:'queue',order:1+Math.floor(Math.random()*P.maxOrder),got:0,t:0,wait:0,
        color:CUST_COLORS[Math.floor(Math.random()*CUST_COLORS.length)],side:-1,walk:0,moving:false,face:{x:0,y:-1}};
      G.customers.push(c); queue.push(c);
    }
  }
  queue.forEach((c,i)=>moveTo(c,270,745+i*26,150,dt));
  const head=queue[0];
  if(head&&Math.hypot(head.x-270,head.y-745)<6){
    const cand=[0,1].filter(s=>!G.sides[s].counter.customer&&G.sides[s].counter.stock>0&&!G.sides[s].trash.counter);
    if(cand.length){
      let s=cand[0];
      const mag=cand.filter(x=>G.sides[x].magnet>0);
      if(mag.length===1)s=mag[0]; // mıknatıs: müşteri çekilen tarafa gider
      else if(cand.length===2){const a=G.sides[0].counter.stock,b=G.sides[1].counter.stock; s=a===b?(Math.random()<.5?0:1):(a>b?0:1);}
      if(G.sides[s].magnet>0)G.sides[s].magnet--;
      head.state='toCounter';head.side=s;G.sides[s].counter.customer=head;
    }
  }
  for(const c of G.customers){
    if(c.state==='toCounter'){const sp=G.sides[c.side].custSpot; if(moveTo(c,sp.x,sp.y,170,dt)){c.state='buy';c.t=0;c.wait=0;c.face={x:c.side?1:-1,y:0};}}
    else if(c.state==='buy'){
      const S=G.sides[c.side];
      if(S.counter.stock>0&&!S.trash.counter){c.wait=0;c.t+=dt;
        if(c.t>=0.25){c.t=0;S.counter.stock--;c.got++;if(c.got>=c.order)custLeave(c);}}
      else{c.wait+=dt;if(c.wait>=P.patience)custLeave(c);}
    }
    else if(c.state==='leave'){if(moveTo(c,c.exitX,1000,170,dt))c.dead=true;}
  }
  G.customers=G.customers.filter(c=>!c.dead);
}

/* ================= BOT ================= */
function goalPos(b){
  if(b.goal.key==='chase'){const e=G.players[1-b.side];return {x:e.x,y:e.y};}
  if(b.goal.key==='box')return G.box?{x:G.box.x,y:G.box.y}:{x:W/2,y:360};
  const z=G.sides[b.goal.side].zones[b.goal.key]; return {x:z.x,y:z.y};
}
function goalValid(b){
  const g=b.goal, me=G.players[b.side], en=G.players[1-b.side];
  if(g.key==='chase')return threatOf(b);
  if(g.key==='box')return !!G.box;
  if(g.rat)return !!G.sides[b.side].rat;
  if(g.clean)return G.sides[g.side].trash[ST[g.key]];
  if(g.key==='bag')return G.sides[b.side].bags>0&&!me.bag;
  if(g.drop)return me.bag&&!G.sides[g.side].trash[ST[g.key]];
  if(g.side!==b.side&&ST[g.key]&&G.sides[g.side].trash[ST[g.key]])return false;
  if(g.side===b.side&&g.key==='grillIn')return me.carry.includes('r');
  if(g.side===b.side&&g.key==='counter')return me.carry.includes('c')&&G.sides[b.side].counter.stock<P.counterCap;
  if(g.key==='money')return availAt(g.side,'money')>0;
  return availAt(g.side,g.key)>0&&me.carry.length<P.carryCap;
}
function botDecide(b){
  const s=b.side,me=G.players[s],en=G.players[1-s],S=G.sides[s],E=G.sides[1-s];
  const raw=me.carry.filter(c=>c==='r').length, cooked=me.carry.length-raw, space=P.carryCap-me.carry.length;
  b.idle=false;
  // Kendi istasyonunda çöp varsa önce temizle (tezgâh en acil)
  for(const [st,k] of [['counter','counter'],['grill',P.autoConveyor?'grillIn':'grillOut'],['fridge','fridge']])
    if(S.trash[st])return {side:s,key:k,clean:true};
  if(S.rat)return {side:s,key:ratZone(),rat:true};
  // Çöp taşıyorsa rakibin en can yakan istasyonuna götür
  if(me.bag&&me.stealLock<=0&&b.stealCd<=0){
    const t=[['counter',E.counter.stock+(E.counter.customer?3:0)],[P.autoConveyor?'grillIn':'grillOut',E.grill.slots.length+E.grill.input],['fridge',E.fridge.count*0.5]]
      .filter(([k])=>!E.trash[ST[k]]).sort((a,c)=>c[1]-a[1]);
    if(t.length)return {side:1-s,key:t[0][0],drop:true};
  }
  if(cooked>0&&(raw===0||S.grill.input>=P.grillSlots*2))return {side:s,key:'counter'};
  if(S.bags>0&&!me.bag&&Math.random()<0.3+P.botAggro*0.6)return {side:s,key:'bag'};
  if(P.stealOn&&b.stealCd<=0&&me.stealLock<=0&&space>=2&&Math.random()<P.botAggro*0.45){
    const safe=k=>!E.trash[ST[k]]&&(en.stun>0.5||dist(en,E.zones[k])>230);
    const o=[];
    if(E.fridge.count>=3&&safe('fridge'))o.push(['fridge',E.fridge.count]);
    if(E.grill.output>=2&&safe('grillOut'))o.push(['grillOut',E.grill.output*1.5]);
    if(E.counter.stock>=2&&safe('counter'))o.push(['counter',E.counter.stock*1.5]);
    if(P.moneySteal&&E.money.amount>=P.price*4&&safe('money'))o.push(['money',E.money.amount/P.price]);
    if(o.length){o.sort((a,c)=>c[1]-a[1]);b.stealCd=4;return {side:1-s,key:o[0][0]};}
  }
  if(raw>0)return {side:s,key:'grillIn'};
  if(cooked>0)return {side:s,key:'counter'};
  if(S.money.amount>=P.price*5)return {side:s,key:'money'};
  if(S.grill.output>=1&&space>0)return {side:s,key:'grillOut'};
  if(S.fridge.count>=2&&space>0)return {side:s,key:'fridge'};
  if(S.money.amount>0)return {side:s,key:'money'};
  if(S.grill.output>0&&space>0)return {side:s,key:'grillOut'};
  b.idle=true; return {side:s,key:'fridge'};
}
// Rakip bizden çalıyor ya da çöp taşıyarak bizim yarımıza girdiyse tehdit var
function threatOf(b){
  const en=G.players[1-b.side];
  if(en.stun>0)return false;
  return !!((en.act&&en.act.steal&&en.act.side===b.side)||(P.bagCatchRoad&&en.bag&&inRivalHalf(en)));
}
function botMove(b,dt){
  const me=G.players[b.side],en=G.players[1-b.side];
  b.stealCd-=dt; b.thinkT-=dt;
  if(me.stun>0){b.goal=null;b.path=[];me.done=false;return ZERO;}
  // Savunma: rakip bizden çalıyorsa/çöp getiriyorsa ve yetişebiliyorsak üstüne koş
  if(threatOf(b)){
    b.alertT+=dt;
    if(b.alertT>=P.botReact/P.botSpeed&&(!b.goal||b.goal.key!=='chase')){
      const rem=en.act&&en.act.steal?en.act.dur-en.act.t:2, tt=dist(me,en)/(P.speed*P.botSpeed);
      if(tt<rem+0.4){b.goal={key:'chase'};b.path=[];b.pathT=0;}
    }
  }else b.alertT=0;
  if(me.done){me.done=false;if(b.goal&&b.goal.key!=='chase')b.goal=null;}
  if(b.goal&&!goalValid(b))b.goal=null;
  const think=b.thinkT<=0; if(think)b.thinkT=0.3;
  if(b.goal&&b.idle&&think)b.goal=null;
  // Kutu düştüyse ve rakipten çok geride değilsek kutuya koş; tezgâhta fare varsa kov
  if(think&&(!b.goal||(b.goal.key!=='chase'&&!b.goal.rat&&!b.goal.clean))){
    const S=G.sides[b.side];
    if(S.rat&&(!b.goal||!b.goal.rat)&&Math.random()<0.8){b.goal={side:b.side,key:ratZone(),rat:true};b.path=[];b.pathT=0;}
    else if(G.box&&(!b.goal||b.goal.key!=='box')){
      const dm=dist(me,G.box),de=en.stun>0?1e9:dist(en,G.box);
      if(dm<de+60&&Math.random()<0.4+P.botAggro*0.5){b.goal={key:'box'};b.path=[];b.pathT=0;}
    }
  }
  // Çalmaya giderken rakip yaklaşırsa vazgeç (saldırganlık düşükse daha çabuk)
  if(think&&b.goal&&b.goal.key!=='chase'&&b.goal.side!==undefined&&b.goal.side!==b.side&&en.stun<=0&&dist(me,en)<140&&Math.random()<0.7*(1-P.botAggro)){b.goal=null;b.stealCd=5;}
  if(!b.goal){b.goal=botDecide(b);b.path=[];b.pathT=0;}
  const tp=goalPos(b);
  b.pathT-=dt;
  if(b.pathT<=0||!b.path.length){b.path=findPath(me,tp);b.pathT=0.25;}
  while(b.path.length>1&&dist(b.path[0],me)<8)b.path.shift();
  const wp=b.path[0]||tp, dx=wp.x-me.x, dy=wp.y-me.y, d=Math.hypot(dx,dy), last=b.path.length<=1;
  if(last&&d<5)return ZERO;
  const m=last&&d<20?d/20:1;
  return {x:dx/d*m*P.botSpeed,y:dy/d*m*P.botSpeed};
}

/* ================= GİRDİ ================= */
const keys=new Set();
addEventListener('keydown',e=>{
  keys.add(e.code);
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if((e.code==='Escape'||e.code==='KeyP')&&G&&!G.demo&&!G.over)togglePause();
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
const sticks=new Map();
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  if(!G||G.demo||G.over||G.paused||G.mode==='watch')return;
  const pt=toLogical(e), side=G.mode==='2p'?(pt.x<W/2?0:1):0;
  for(const [id,s] of sticks)if(s.side===side)sticks.delete(id);
  sticks.set(e.pointerId,{side,bx:pt.x,by:pt.y,x:pt.x,y:pt.y});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{const s=sticks.get(e.pointerId);if(!s)return;const pt=toLogical(e);s.x=pt.x;s.y=pt.y;});
const endStick=e=>sticks.delete(e.pointerId);
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
function stickRaw(s){let x=(s.x-s.bx)/55,y=(s.y-s.by)/55;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}return {x,y,m:Math.min(m,1)};}
function stickVec(side){
  for(const s of sticks.values())if(s.side===side){const v=stickRaw(s);return v.m<0.15?ZERO:{x:v.x,y:v.y};}
  return ZERO;
}
function inputFor(side,dt){
  const bot=G.bots.find(b=>b.side===side);
  if(bot)return botMove(bot,dt);
  const k=c=>keys.has(c)?1:0;
  const v={x:0,y:0};
  if(side===0){v.x+=k('KeyD')-k('KeyA');v.y+=k('KeyS')-k('KeyW');
    if(G.mode!=='2p'){v.x+=k('ArrowRight')-k('ArrowLeft');v.y+=k('ArrowDown')-k('ArrowUp');}}
  else{v.x+=k('ArrowRight')-k('ArrowLeft');v.y+=k('ArrowDown')-k('ArrowUp');}
  const sv=stickVec(side); v.x+=sv.x; v.y+=sv.y;
  const m=Math.hypot(v.x,v.y); if(m>1){v.x/=m;v.y/=m;}
  return v;
}

/* ================= GÜNCELLEME ================= */
function update(dt){
  G.t+=dt; G.time-=dt;
  if(G.time<=0){G.time=0;endGame();return;}
  if(P.rushHour&&G.time<=30&&!G.rush){G.rush=true;toast('YOĞUN SAAT!','#facc15');beep(660,0.2,'triangle');}
  for(const S of G.sides){
    const f=S.fridge; if(!S.trash.fridge)f.acc+=dt;
    while(f.acc>=P.meatInterval){f.acc-=P.meatInterval;if(f.count<99)f.count++;}
    const g=S.grill;
    if(S.goldT>0)S.goldT=Math.max(0,S.goldT-dt);
    // bant: pişen et tezgâha kayar; tezgâh doluysa bant, bant doluysa ızgara bekler
    S.belt.forEach((it,i)=>{it.t=Math.min(it.t+dt/P.beltTime,1-i*BELT_GAP);});
    while(S.belt.length&&S.belt[0].t>=1&&S.counter.stock<P.counterCap){S.belt.shift();S.counter.stock++;}
    if(S.trash.grill)continue; // çöp: ızgara durur
    for(let i=g.slots.length-1;i>=0;i--){
      g.slots[i]-=dt;
      if(g.slots[i]<=0){
        if(P.autoConveyor){if(S.belt.length>=BELT_MAX){g.slots[i]=0;continue;}S.belt.push({t:0});}
        else g.output++;
        g.slots.splice(i,1);
      }
    }
    while(g.slots.length<P.grillSlots&&g.input>0){g.input--;g.slots.push(P.cookTime);}
  }
  for(const p of G.players){
    if(p.stun>0)p.stun=Math.max(0,p.stun-dt);
    if(p.stealLock>0)p.stealLock=Math.max(0,p.stealLock-dt);
    if(p.speedT>0)p.speedT=Math.max(0,p.speedT-dt);
    let v=inputFor(p.side,dt);
    if(p.kb){
      const s=Math.min(dt,p.kb.t);p.x+=p.kb.vx*s;p.y+=p.kb.vy*s;p.kb.t-=dt;if(p.kb.t<=0)p.kb=null;
      collide(p);continue;
    }
    if(p.stun>0)v=ZERO;
    const m=Math.hypot(v.x,v.y);
    p.moving=m>0.05;
    const sp=P.speed*(p.speedT>0?SPEED_BOOST:1);
    if(p.moving){p.x+=v.x*sp*dt;p.y+=v.y*sp*dt;p.face={x:v.x/m,y:v.y/m};p.walk+=dt*(p.speedT>0?SPEED_BOOST:1);}
    collide(p);
  }
  for(const p of G.players)interact(p,dt);
  checkCatches();
  updateCustomers(dt);
  updateBox(dt);
  updateRats(dt);
  for(const f of G.floats)f.t+=dt; G.floats=G.floats.filter(f=>f.t<f.life);
  for(const t of G.toasts)t.t+=dt; G.toasts=G.toasts.filter(t=>t.t<t.life);
}
function endGame(){
  G.over=true;
  if(G.sim)return;
  if(G.demo){newGame('watch',{demo:true});return;}
  sticks.clear(); showEnd(); beep(523,0.15,'triangle'); setTimeout(()=>beep(784,0.25,'triangle'),160);
}

/* ================= ÇİZİM ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function text(t,x,y,size,color,align='center',weight='700',stroke=0){
  ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineJoin='round';ctx.strokeText(t,x,y);}
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}
function pill(x,y,t,bg,size=11,fg='#fff'){
  ctx.font=`700 ${size}px ${FONT}`;const w=ctx.measureText(t).width+12,h=size*1.5;
  rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=bg;ctx.fill();text(t,x,y+0.5,size,fg);
}
function star(x,y,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}
  ctx.closePath();ctx.fillStyle='#facc15';ctx.fill();ctx.strokeStyle='#a16207';ctx.lineWidth=1;ctx.stroke();
}
function drawBox(b,top,front){
  ctx.fillStyle=front;ctx.fillRect(b.x,b.y+b.h-b.H,b.w,b.H);
  ctx.fillStyle=top;ctx.fillRect(b.x,b.y-b.H,b.w,b.h);
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1.5;
  ctx.strokeRect(b.x+.5,b.y-b.H+.5,b.w-1,b.h+b.H-1);
  ctx.beginPath();ctx.moveTo(b.x,b.y+b.h-b.H);ctx.lineTo(b.x+b.w,b.y+b.h-b.H);ctx.stroke();
}
function drawMeat(x,y,t,w=18,h=7){
  rr(x-w/2,y-h/2,w,h,3);
  if(t==='r'){
    ctx.fillStyle='#f0828a';ctx.fill();ctx.strokeStyle='#a83e48';ctx.lineWidth=1;ctx.stroke();
    ctx.strokeStyle='#ffe4e6';ctx.beginPath();ctx.moveTo(x-w/2+4,y);ctx.lineTo(x+w/2-4,y);ctx.stroke();
  }else{
    ctx.fillStyle='#8b4a26';ctx.fill();ctx.strokeStyle='#4a230f';ctx.lineWidth=1;ctx.stroke();
    ctx.strokeStyle='#3a1a0a';ctx.beginPath();
    for(let i=-1;i<=1;i++){ctx.moveTo(x+i*5-2,y-h/2+1);ctx.lineTo(x+i*5+2,y+h/2-1);}ctx.stroke();
  }
}
function drawBill(x,y){rr(x-10,y-4,20,8,2);ctx.fillStyle='#22c55e';ctx.fill();ctx.strokeStyle='#14532d';ctx.lineWidth=1;ctx.stroke();circle(x,y,2);ctx.fillStyle='#bbf7d0';ctx.fill();}

function drawChar(x,y,o){
  ctx.save(); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.fillStyle='rgba(0,0,0,.22)';ellipse(x,y,15,6);ctx.fill();
  const bob=o.moving?Math.abs(Math.sin(o.walk*14))*2.5:0, yy=y-bob;
  ctx.fillStyle='#2b2f3a';
  const leg=o.moving?Math.sin(o.walk*14)*2:0;
  ctx.fillRect(x-8,yy-8+leg,6,8);ctx.fillRect(x+2,yy-8-leg,6,8);
  rr(x-13,yy-32,26,26,9);ctx.fillStyle=o.body;ctx.fill();ctx.strokeStyle=o.dark;ctx.lineWidth=2;ctx.stroke();
  if(o.apron){rr(x-8,yy-26,16,17,4);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();}
  circle(x,yy-40,11);ctx.fillStyle=o.skin||'#f6c89f';ctx.fill();ctx.strokeStyle='#b07a4f';ctx.lineWidth=1.5;ctx.stroke();
  const f=o.face||{x:0,y:1};
  if(o.stun>0){text('x  x',x,yy-41,8,'#222');}
  else if(f.y>-0.7){ctx.fillStyle='#222';const ex=f.x*3,ey=f.y*1.5;circle(x-4+ex,yy-41+ey,1.8);ctx.fill();circle(x+4+ex,yy-41+ey,1.8);ctx.fill();}
  let top=yy-56;
  if(o.hat){
    ctx.fillStyle='#fff';ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;
    rr(x-8,yy-55,16,7,2);ctx.fill();ctx.stroke();
    circle(x-5,yy-58,5);ctx.fill();circle(x+5,yy-58,5);ctx.fill();circle(x,yy-61,6);ctx.fill();
    ctx.fillStyle=o.dark;ctx.fillRect(x-8,yy-50,16,2);
    top=yy-72;
  }
  if(o.carry)for(let i=0;i<o.carry.length;i++)drawMeat(x,top-i*7,o.carry[i]);
  if(o.stun>0){const t=performance.now()/1000;for(let i=0;i<3;i++){const a=t*5+i*2.094;star(x+Math.cos(a)*16,yy-62+Math.sin(a)*4,5);}}
  ctx.restore();
}

const ZLABEL={fridge:'DOLAP',grillIn:'ÇİĞ ET',grillOut:'PİŞMİŞ',counter:'SERVİS',money:'KASA',bag:'ÇÖP'};

      circle(z.x,z.y,z.r);ctx.fillStyle=s?'rgba(239,68,68,.12)':'rgba(59,130,246,.12)';ctx.fill();

    }}

function drawFridge(S,s){
  const b=S.fridge.box;drawBox(b,'#e6edf3','#b8c4cf');
  ctx.fillStyle=COL[s];ctx.fillRect(b.x,b.y-b.H,b.w,6);

  rr(b.x+8,fy+6,b.w-16,b.H-12,4);ctx.fillStyle='#cfe8f7';ctx.fill();ctx.strokeStyle='#8aa4b8';ctx.lineWidth=1.5;ctx.stroke();
  const n=Math.min(S.fridge.count,12);
  for(let i=0;i<n;i++){const c=i%3,r=Math.floor(i/3);drawMeat(b.x+8+(b.w-16)/6*(2*c+1),fy+b.H-14-r*10,'r',16,6);}
  pill(b.x+b.w/2,b.y-b.H+30,'×'+S.fridge.count,'rgba(0,0,0,.6)',12);
}
function drawGrill(S,s){
  const b=S.grill.box,g=S.grill;drawBox(b,'#4b4f58','#2a2d33');
  ctx.fillStyle=COL[s];ctx.fillRect(b.x,b.y+b.h-b.H,b.w,4);
  const top=b.y-b.H;
  // giriş tepsisi (üst kenar)
  rr(b.x+6,top+4,b.w-12,14,3);ctx.fillStyle='#9ca3af';ctx.fill();
  for(let i=0;i<Math.min(g.input,4);i++)drawMeat(b.x+18+i*15,top+11,'r',13,5);
  if(g.input>0)pill(b.x+b.w-10,top+2,'×'+g.input,'rgba(0,0,0,.65)',9);
  // pişirme ızgarası
  const n=P.grillSlots,cols=Math.min(n,4),rows=Math.ceil(n/cols);
  const gx=b.x+8,gy=top+22,gw=b.w-16,gh=b.h-28;
  ctx.fillStyle='#1f2126';ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeStyle='#555';ctx.lineWidth=1;
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(gx,gy+gh*i/6);ctx.lineTo(gx+gw,gy+gh*i/6);ctx.stroke();}
  for(let i=0;i<n;i++){
    const cx=gx+gw*((i%cols)+0.5)/cols, cy=gy+gh*(Math.floor(i/cols)+0.5)/rows;
    if(i<g.slots.length){
      const pr=1-g.slots[i]/P.cookTime;
      circle(cx,cy,9);ctx.fillStyle=`rgba(251,146,60,${0.35+0.25*Math.sin(G.t*10+i)})`;ctx.fill();
      drawMeat(cx,cy,pr<0.6?'r':'c',14,6);
      ctx.beginPath();ctx.arc(cx,cy,9,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);ctx.strokeStyle='#fde047';ctx.lineWidth=2;ctx.stroke();
    }
  }
  // çıkış tepsisi (önde)
  const ox=b.x+b.w/2, oy=b.y+b.h+10;
  rr(ox-22,oy-6,44,12,3);ctx.fillStyle='#cbd5e1';ctx.fill();ctx.strokeStyle='#64748b';ctx.lineWidth=1;ctx.stroke();
  for(let i=0;i<Math.min(g.output,8);i++)drawMeat(ox,oy-i*5,'c',16,6);
  if(g.output>0)pill(ox+30,oy-4,'×'+g.output,'rgba(0,0,0,.65)',10);
}

  return {x0:g.x+g.w/2,y0:g.y+g.h+6,x1:c.x+c.w/2,y1:c.y-c.H+c.h-14};
}
function drawBelt(S){

  ctx.beginPath();ctx.moveTo(b.x0,b.y0);ctx.lineTo(b.x1,b.y1);ctx.stroke();
  ctx.lineWidth=12;ctx.strokeStyle='#94a3b8';ctx.setLineDash([6,6]);ctx.lineDashOffset=-G.t*30;
  ctx.beginPath();ctx.moveTo(b.x0,b.y0);ctx.lineTo(b.x1,b.y1);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;ctx.lineCap='butt';

function drawSabotageBox(){
  // düşmeden önce yer işareti
  if(!G.box&&G.nextBox&&G.boxT<3){
    const b=G.nextBox,pulse=0.5+0.5*Math.sin(G.t*10);
    ctx.globalAlpha=0.5+0.3*pulse;circle(b.x,b.y,22);ctx.setLineDash([5,5]);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.globalAlpha=0.6;drawEmoji(BOX_INFO[b.type].icon,b.x,b.y,18);ctx.globalAlpha=1;
    text(String(Math.ceil(G.boxT)),b.x,b.y+32,13,'#facc15','center','900',3);
  }
  if(!G.box)return;
  const b=G.box,k=clamp(b.t/BOX_FALL,0,1),h=(1-k)*(1-k)*320,landed=k>=1;
  ctx.fillStyle='rgba(0,0,0,'+(0.15+0.2*k)+')';ellipse(b.x,b.y+2,14+6*k,5+2*k);ctx.fill();
  const y=b.y-14-h,pulse=landed?Math.sin(G.t*8)*2:0;
  if(landed){circle(b.x,y,24+pulse);ctx.fillStyle='rgba(250,204,21,.25)';ctx.fill();}
  rr(b.x-16,y-14,32,28,6);ctx.fillStyle='#f59e0b';ctx.fill();ctx.strokeStyle='#92400e';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.fillRect(b.x-16,y-3,32,5);
  drawEmoji(BOX_INFO[b.type].icon,b.x,y-24,20);
  if(landed)text(BOX_INFO[b.type].name,b.x,y+24,10,'#fff','center','900',3);
}
function drawBags(S){
  const z=S.zones.bag;
  for(let i=0;i<S.bags;i++)drawTrash(z.x+(i-(S.bags-1)/2)*20,z.y-2,0.85);
}
function drawCustomer(c){
  drawChar(c.x,c.y,{body:c.color,dark:'rgba(0,0,0,.35)',walk:c.walk,moving:c.moving,face:c.face,skin:c.skin});
  const need=c.order-c.got;
  if((c.state==='buy'||c.state==='toCounter')&&need>0){
    const bx=c.x,by=c.y-66;
    rr(bx-18,by-10,36,20,8);ctx.fillStyle='#fff';ctx.fill();
    if(c.state==='buy'&&c.wait>0){ctx.beginPath();ctx.arc(bx,by,13,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-c.wait/P.patience));ctx.strokeStyle='#f43f5e';ctx.lineWidth=2;ctx.stroke();}
    drawMeat(bx-6,by,'c',12,5);text('×'+need,bx+8,by+1,10,'#111');
  }
}
function drawHUD(){
  ctx.fillStyle='#12151d';ctx.fillRect(0,0,W,88);
  const nm=names();
  for(let s=0;s<2;s++){
    const x=s?W-18:18,al=s?'right':'left',p=G.players[s];
    text(nm[s],x,20,13,COL[s],al,'800');
    text('$'+p.score,x,50,30,'#fff',al,'800');
    if(P.trashAttack){ // bir sonraki çöp torbasına kalan satış
      const bw=78,bx=s?W-18-bw:18,f=clamp(p.atk/P.attackEvery,0,1);
      rr(bx,74,bw,7,3.5);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();
      if(f>0){rr(s?bx+bw*(1-f):bx,74,bw*f,7,3.5);ctx.fillStyle='#84cc16';ctx.fill();}
      drawTrash(s?bx-9:bx+bw+9,77,0.42);
    }
  }
  const t=Math.ceil(G.time),mm=Math.floor(t/60),ss=String(t%60).padStart(2,'0');
  text(mm+':'+ss,W/2,32,30,G.time<=30?'#f87171':'#fff','center','800');
  if(G.rush)text('YOĞUN SAAT',W/2,9,9,'#facc15','center','800');
  const lead=G.players[0].score-G.players[1].score;
  if(P.tugWar){
    // Halat (sadece gösterge): önde olan düğümü kendi tarafına çeker. Uç = önde olan, liderin skorunun yarısı kadar önde.
    const sc=Math.max(150,Math.max(G.players[0].score,G.players[1].score)*0.5);
    const x0=150,x1=W-150,cx=W/2,hw=(x1-x0)/2,k=clamp(lead/sc,-1,1),kx=cx-k*hw;
    rr(x0,72,x1-x0,8,4);ctx.fillStyle='#2a2f3f';ctx.fill();
    if(lead!==0){const a=Math.min(cx,kx);rr(a,72,Math.max(Math.abs(kx-cx),2),8,3);ctx.fillStyle=COL[lead>0?0:1];ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(cx-1,69,2,14);
    circle(kx,76,7);ctx.fillStyle='#facc15';ctx.fill();ctx.strokeStyle='#a16207';ctx.lineWidth=2;ctx.stroke();
    text(lead!==0?'fark $'+Math.abs(lead):'berabere',cx,58,10,lead>0?'#93c5fd':lead<0?'#fca5a5':'#9aa3b8','center','700');
  }else if(lead!==0)text((lead>0?'◀ ':'')+'$'+Math.abs(lead)+(lead<0?' ▶':''),W/2,64,11,lead>0?COL[0]:COL[1],'center','700');
}
function render(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(!G){ctx.fillStyle='#0f1117';ctx.fillRect(0,0,W,H);return;}
  drawFloor();drawZones();
  G.sides.forEach(drawBelt);
  const L=[];
  G.sides.forEach((S,s)=>{
    L.push({y:S.fridge.box.y+S.fridge.box.h,f:()=>drawFridge(S,s)});
    L.push({y:S.grill.box.y+S.grill.box.h,f:()=>drawGrill(S,s)});
    L.push({y:S.counter.box.y+S.counter.box.h,f:()=>drawCounter(S,s)});
    for(const st of ['fridge','grill','counter'])if(S.trash[st])L.push({y:S[st].box.y+S[st].box.h+0.1,f:()=>drawStationTrash(S,st)});
    L.push({y:S.zones.money.y,f:()=>drawMoney(S,s)});
    if(S.bags>0)L.push({y:S.zones.bag.y,f:()=>drawBags(S)});
    if(S.rat)L.push({y:P.ratMoney?S.zones.money.y+0.2:S.counter.box.y+S.counter.box.h+0.2,f:()=>drawRat(S)});
  });
  for(const c of G.customers)L.push({y:c.y,f:()=>drawCustomer(c)});
  for(const p of G.players)L.push({y:p.y,f:()=>{
    drawChar(p.x,p.y,{body:COL[p.side],dark:COLD[p.side],hat:true,apron:true,carry:p.carry,stun:p.stun,face:p.face,walk:p.walk,moving:p.moving});
    if(p.bag)drawTrash(p.x+(p.face.x<0?-19:19),p.y-16,0.75);
  }});
  L.sort((a,b)=>a.y-b.y).forEach(d=>d.f());
  G.sides.forEach(drawBeltItems);
  G.sides.forEach((S,s)=>{
    const c=S.counter.box;let y=c.y-c.H-14;
    if(S.magnet>0){pill(c.x+c.w/2,y,'🧲 ×'+S.magnet,COLD[s],11);y-=20;}
    if(S.goldT>0)pill(c.x+c.w/2,y,'💰 ×2 '+Math.ceil(S.goldT),'#a16207',11);
    if(S.counter.stock>=P.counterCap)text('DOLU',c.x+c.w/2,c.y+c.h+10,9,'#facc15','center','900',3);
  });
  for(const p of G.players)if(p.speedT>0){drawEmoji('👟',p.x-18,p.y-6,14);}
  drawSabotageBox();
  // çalma uyarıları
  for(const p of G.players)if(p.act&&p.act.steal){
    const v=p.act.side,z=G.sides[v].zones[p.act.key],pulse=0.5+0.5*Math.sin(G.t*14);
    ctx.globalAlpha=0.35+0.3*pulse;ctx.strokeStyle='#f43f5e';ctx.lineWidth=8;
    ctx.strokeRect(v?W/2:FLOOR.x0,FLOOR.y0,v?FLOOR.x1-W/2:W/2-FLOOR.x0,FLOOR.y1-FLOOR.y0);ctx.globalAlpha=1;
    circle(z.x+z.r-4,z.y-z.r+4,12+pulse*2);ctx.fillStyle='#e11d48';ctx.fill();text('!',z.x+z.r-4,z.y-z.r+5,17,'#fff','center','900');
  }
  // sersemleme yazısı
  for(const p of G.players)if(p.stun>0)text('SERSEM '+p.stun.toFixed(1),p.x,p.y+16,11,'#facc15','center','800',3);
  for(const f of G.floats){const k=f.t/f.life;ctx.globalAlpha=1-k;text(f.text,f.x,f.y-k*40,14,f.color,'center','800',3);ctx.globalAlpha=1;}
  G.toasts.forEach((t,i)=>{const k=t.t/t.life,a=k<0.1?k/0.1:k>0.8?(1-k)/0.2:1;ctx.globalAlpha=a;text(t.text,W/2,300+i*38,26,t.color,'center','900',5);ctx.globalAlpha=1;});
  for(const s of sticks.values()){
    const v=stickRaw(s);
    ctx.globalAlpha=0.25;circle(s.bx,s.by,55);ctx.fillStyle='#fff';ctx.fill();
    ctx.globalAlpha=0.75;circle(s.bx+v.x*55,s.by+v.y*55,24);ctx.fillStyle=COL[s.side];ctx.fill();ctx.globalAlpha=1;
  }
  drawHUD();
}

/* ================= ARAYÜZ ================= */
const OVS=['menu','settings','pause','end'];
let lastMode='bot',settingsFrom='menu';
function show(id){
  OVS.forEach(x=>$(x).classList.toggle('hidden',x!==id));
  $('pauseBtn').classList.toggle('hidden',!(id===null&&G&&!G.demo));
  if(id==='menu')$('helpText').innerHTML=helpHTML();
}
function helpHTML(){
  return `<b>Kontrol:</b> Telefonda ekrana dokunup sürükle (sanal joystick). Bilgisayarda WASD veya ok tuşları. P / Esc duraklatır.<br>
  <b>Döngü:</b> İstasyonların üstünden geçmen yeter, etler kendiliğinden akar. Dolaptan çiğ et al, ızgaranın üstüne bırak${P.autoConveyor?'; pişen et bantla tezgâha kendisi gider':', pişince önünden al, servis tezgâhına bırak'}. Müşterinin bıraktığı parayı kasadan topla. Et kıt: dolap ${P.meatInterval} sn'de 1 et üretir.<br>
  ${P.boxOn?`<b>Sabotaj kutusu:</b> Her ${P.boxEvery} sn'de ortaya bir kutu düşer; yeri ve içinde ne olduğu 3 sn önceden görünür. İlk dokunan alır ve etki rakibe kendiliğinden uygulanır. 🐀 <b>Fare</b>: ${P.ratMoney?'rakibin kasasındaki parayı kemirir; sahibi kasaya gidince kaçar':'rakibin tezgâhındaki eti yer; sahibi tezgâha gidince kaçar'}. 🗑️ <b>Çöp</b>: ${P.boxTrashCounter?'rakibin tezgâhını kapatır, müşteriler sana gelir':'rakibin ızgarasını durdurur'}; sahibi ${P.trashClean} sn'de temizler. 🧲 <b>Mıknatıs</b>: sonraki ${P.magnetN} müşteri sana gelir. 👟 <b>Hız</b>: ${P.buffTime} sn hızlı koşarsın. 💰 <b>×2 Fiyat</b>: ${P.buffTime} sn satışların iki kat para getirir.<br>
  <b>Tezgâh:</b> Müşteri daha dolu tezgâha gider. Dükkânı uzun süre bırakırsan rakibin tezgâhı seninkini geçer ve müşteriler ona akar (en fazla ${P.counterCap} et).<br>`:''}
  ${P.stealOn?`<b>Çalma:</b> Rakibin dolabında, ızgara çıkışında ya da servis tezgâhında ${P.stealTime} sn durursan oradakileri çalarsın. Bu sırada rakip sana değerse ${P.stunTime} sn sersemlersin ve etler ona geçer.<br>`:''}
  ${P.trashAttack?`<b>Çöp:</b> Her ${P.attackEvery} et satışında tarafının altında bir çöp torbası belirir. Alıp rakibin dolabına, ızgarasına ya da tezgâhına ${P.trashDrop} sn'de bırakırsın; o istasyon sahibi ${P.trashClean} sn'de temizleyene kadar durur. Torbayla rakibin yarısında yakalanırsan sersemlersin ve torba gider.<br>`:''}
  ${P.tugWar?`<b>Halat:</b> Üstteki çubuk kimin ne kadar önde olduğunu gösterir. Maç her zaman süre bitince biter.<br>`:''}
  <b>2 kişi:</b> Sol yarıya dokunan Mavi'yi, sağ yarıya dokunan Kırmızı'yı yönetir. Klavyede WASD ve Oklar.`;
}
function decimals(step){return (String(step).split('.')[1]||'').length;}
function buildSettings(){
  const box=$('params');box.innerHTML='';
  for(const [k,label,min,max,step] of PARAMS){
    const d=document.createElement('div');d.className='prm';
    d.innerHTML=`<label><span>${label}</span><b></b></label><input type="range" min="${min}" max="${max}" step="${step}">`;
    const inp=d.querySelector('input'),b=d.querySelector('b');
    inp.value=P[k];const upd=()=>b.textContent=Number(P[k]).toFixed(decimals(step));upd();
    inp.addEventListener('input',()=>{P[k]=parseFloat(inp.value);upd();});
    box.appendChild(d);
  }
  for(const [k,label] of TOGGLES){
    const d=document.createElement('label');d.className='tog';
    d.innerHTML=`<input type="checkbox"><span>${label}</span>`;
    const inp=d.querySelector('input');inp.checked=!!P[k];
    inp.addEventListener('change',()=>{P[k]=inp.checked;});
    box.appendChild(d);
  }
}
function showEnd(){
  const [a,b]=G.players,nm=names();
  let title;
  const win=a.score===b.score?-1:a.score>b.score?0:1;
  if(win<0)title='BERABERE';
  else if(G.mode==='bot')title=win===0?'KAZANDIN! 🎉':'KAYBETTİN';
  else title=nm[win]+' KAZANDI';
  $('endTitle').textContent=title;
  const row=(l,f)=>`<tr><td>${l}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
  $('endStats').innerHTML=`<table><tr><th></th><th class="c0">${nm[0]}</th><th class="c1">${nm[1]}</th></tr>
    ${row('Toplanan para',p=>'$'+p.score)}
    ${P.trashAttack?row('Bıraktığı çöp',p=>p.st.trashSent)+row('Yediği çöp',p=>p.st.trashGot):''}
    ${row('Satılan et',p=>p.st.sold)}
    ${P.boxOn?row('Aldığı kutu',p=>p.st.boxes)+row('Farenin yediği',p=>p.st.ratLost):''}
    ${P.stealOn?row('Çalınan et',p=>p.st.stole):''}
    ${P.stealOn||P.trashAttack?row('Yakaladığı hırsız',p=>p.st.caught)+row('Yakalandığı',p=>p.st.gotCaught):''}
    ${row('Kasada kalan',(p)=>'$'+G.sides[p.side].money.amount)}</table>`;
  show('end');
}
function startMode(mode){lastMode=mode;newGame(mode);show(null);}
function toMenu(){newGame('watch',{demo:true});show('menu');}
function togglePause(){if(!G||G.demo||G.over)return;G.paused=!G.paused;sticks.clear();show(G.paused?'pause':null);}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{beepInit();startMode(b.dataset.mode);}));
$('openSettings').onclick=()=>{settingsFrom='menu';buildSettings();show('settings');};
$('pauseSettings').onclick=()=>{settingsFrom='pause';buildSettings();show('settings');};
$('closeSettings').onclick=()=>{saveP();show(settingsFrom);};
$('resetParams').onclick=()=>{P=Object.assign({},DEF);buildSettings();};
$('pauseBtn').onclick=togglePause;
$('resume').onclick=togglePause;
$('restart').onclick=()=>startMode(G.mode);
$('pauseMenu').onclick=toMenu;
$('again').onclick=()=>startMode(lastMode);
$('endMenu').onclick=toMenu;
function beepInit(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}

/* ================= DÖNGÜ ================= */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(G&&!G.paused&&!G.over)update(dt);
  render();
  requestAnimationFrame(frame);
}
toMenu();
requestAnimationFrame(frame);

/* ================= TEST / DENGE ARACI =================
   Tarayıcı konsolunda: MW.simulate(10) → 10 bot-vs-bot maçı anında oynatır, sonuçları döner. */
window.MW={
  simulate(n=5){
    const keep=G,res=[];
    for(let i=0;i<n;i++){
      newGame('watch',{sim:true});
      let guard=0;while(!G.over&&guard++<200000)update(1/30);
      res.push({mavi:G.players[0].score,kirmizi:G.players[1].score,maviStat:{...G.players[0].st},kirmiziStat:{...G.players[1].st}});
    }
    G=keep;return res;
  },
  // Oyunu sn kadar ileri sarar (test için)
  step(sec=1,dt=1/30){for(let t=0;t<sec&&G&&!G.over;t+=dt)update(dt);render();},
  get P(){return P;},
  get G(){return G;},
};
})();
